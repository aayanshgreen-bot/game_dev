<!-- Cryptix Games -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --bg:#0a0a0b;
    --sidebar:#111113;
    --surface:#151517;
    --surface-2:#1c1c1f;
    --line:#2a2a2e;
    --text:#f2f2f0;
    --muted:#8c8c92;
    --accent:#ffb92e;
    --accent-dim:#7a5a16;
    --danger:#ff5c5c;
    --radius:12px;
  }
  *{box-sizing:border-box;}
  #cryptix-root{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    overflow-x:hidden;
  }
  .cx-mono{font-family:'JetBrains Mono',monospace;}
  .cx-display{font-family:'Space Grotesk',sans-serif;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;}

  /* sidebar */
  .cx-sidebar{
    width:60px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;
    position:sticky;top:0;height:100vh;overflow-y:auto;z-index:25;
  }
  .cx-side-logo{width:32px;height:32px;margin-bottom:10px;cursor:pointer;flex-shrink:0;}
  .cx-side-item{
    width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--muted);cursor:pointer;flex-shrink:0;transition:all .15s ease;
  }
  .cx-side-item:hover{background:var(--surface-2);color:var(--text);}
  .cx-side-item.active{background:rgba(255,185,46,0.12);color:var(--accent);}

  .cx-main{flex:1;min-width:0;display:flex;flex-direction:column;}

  /* topbar */
  .cx-topbar{
    display:flex;align-items:center;gap:18px;padding:14px 24px;
    border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(10,10,11,0.9);
    backdrop-filter:blur(8px);z-index:20;
  }
  .cx-logo{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0;}
  .cx-logo svg{width:26px;height:26px;}
  .cx-logo-text{
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;
    background:linear-gradient(90deg,#fff,#8c8c92);-webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:0.3px;white-space:nowrap;
  }
  .cx-search-wrap{flex:1;max-width:560px;position:relative;}
  .cx-search-wrap input{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 14px 10px 38px;color:var(--text);font-family:'Inter',sans-serif;font-size:13.5px;
  }
  .cx-search-wrap input:focus{outline:2px solid var(--accent);outline-offset:0;}
  .cx-search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none;}
  .cx-nav{display:flex;align-items:center;gap:12px;flex-shrink:0;}
  .cx-btn{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    padding:9px 18px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--text);cursor:pointer;transition:all .15s ease;white-space:nowrap;
  }
  .cx-btn:hover{border-color:var(--muted);}
  .cx-btn-primary{background:var(--accent);color:#1a1200;border:none;}
  .cx-btn-primary:hover{filter:brightness(1.08);}
  .cx-user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap;}
  .cx-user-chip b{color:var(--text);}

  /* content */
  .cx-content{padding:22px 24px 90px;max-width:1400px;width:100%;margin:0 auto;}
  .cx-section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 0 14px;flex-wrap:wrap;gap:10px;}
  .cx-section-head h2{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0;}
  .cx-section-head:first-child{margin-top:6px;}
  .cx-count{color:var(--muted);font-size:12.5px;}

  /* hero picks */
  .cx-hero-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:340px;}
  .cx-hero-tile{
    position:relative;border-radius:var(--radius);overflow:hidden;cursor:pointer;border:1px solid var(--line);
    background:var(--surface);
  }
  .cx-hero-tile:nth-child(1){grid-row:1/3;}
  .cx-hero-tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s ease;}
  .cx-hero-tile:hover img{transform:scale(1.05);}
  .cx-hero-badge{
    position:absolute;top:10px;left:10px;background:var(--accent);color:#1a1200;font-weight:700;
    font-size:10.5px;padding:3px 9px;border-radius:6px;font-family:'Space Grotesk',sans-serif;
  }
  .cx-hero-overlay{
    position:absolute;left:0;right:0;bottom:0;padding:14px;
    background:linear-gradient(0deg,rgba(0,0,0,0.85),rgba(0,0,0,0));
  }
  .cx-hero-overlay h4{margin:0;font-family:'Space Grotesk',sans-serif;font-size:15px;color:#fff;}

  /* game card grid */
  .cx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;}
  .cx-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s ease, transform .15s ease;
  }
  .cx-card:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
  .cx-thumb-wrap{position:relative;width:100%;aspect-ratio:16/10;background:var(--surface-2);overflow:hidden;}
  .cx-thumb-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .cx-thumb-play{
    position:absolute;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;
    opacity:0;transition:opacity .15s ease;
  }
  .cx-thumb-wrap:hover .cx-thumb-play{opacity:1;}
  .cx-thumb-play button{
    background:var(--accent);color:#1a1200;border:none;border-radius:999px;padding:9px 20px;
    font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;
  }
  .cx-thumb-play a{
    background:var(--accent);color:#1a1200;border:none;border-radius:999px;padding:9px 20px;
    font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:13px;cursor:pointer;text-decoration:none;
  }
  .cx-type-chip{
    position:absolute;top:8px;right:8px;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:#fff;
    background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:5px;
  }
  .cx-card-body{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
  .cx-card h3{font-family:'Space Grotesk',sans-serif;font-size:14.5px;margin:0;line-height:1.25;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;}
  .cx-card p{color:var(--muted);font-size:12px;line-height:1.45;margin:0;
    overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:34px;}
  .cx-card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;font-size:11px;color:var(--muted);}
  .cx-delete{
    background:none;border:1px solid var(--line);color:var(--danger);
    font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;
    padding:4px 8px;border-radius:6px;cursor:pointer;transition:all .15s ease;
  }
  .cx-delete:hover{border-color:var(--danger);background:rgba(255,92,92,0.08);}
  .cx-edit{
    background:none;border:1px solid var(--line);color:var(--accent);
    font-family:'Inter',sans-serif;font-size:10.5px;font-weight:600;
    padding:4px 8px;border-radius:6px;cursor:pointer;transition:all .15s ease;
  }
  .cx-edit:hover{border-color:var(--accent);background:rgba(255,185,46,0.08);}

  .cx-empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);}

  /* fab */
  .cx-fab{
    position:fixed;bottom:26px;right:26px;
    background:var(--accent);color:#1a1200;border:none;border-radius:999px;
    padding:14px 22px;font-weight:700;font-family:'Space Grotesk',sans-serif;font-size:14px;
    cursor:pointer;box-shadow:0 8px 24px rgba(255,185,46,0.25);z-index:15;
  }
  .cx-fab:hover{filter:brightness(1.08);}

  /* modal */
  .cx-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;
  }
  .cx-modal{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    width:100%;max-width:440px;padding:26px;position:relative;max-height:88vh;overflow-y:auto;
  }
  .cx-modal h3{font-family:'Space Grotesk',sans-serif;font-size:20px;margin:0 0 4px;}
  .cx-modal .cx-sub{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .cx-field{margin-bottom:14px;}
  .cx-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .cx-field input,.cx-field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:10px 12px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;
  }
  .cx-field input[type="file"]{padding:8px;font-size:12.5px;}
  .cx-pass-wrap{position:relative;}
  .cx-pass-wrap input{padding-right:42px;}
  .cx-pass-toggle{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;font-size:15px;line-height:1;
  }
  .cx-pass-toggle:hover{color:var(--text);}
  .cx-field textarea{resize:vertical;min-height:70px;}
  .cx-field input:focus,.cx-field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .cx-modal-actions{display:flex;gap:10px;margin-top:18px;}
  .cx-close{
    position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);
    font-size:18px;cursor:pointer;
  }
  .cx-error{color:var(--danger);font-size:12.5px;margin:-4px 0 10px;}
  .cx-hint{color:var(--muted);font-size:11.5px;margin-top:5px;}
  .cx-switch{color:var(--muted);font-size:12.5px;margin-top:14px;text-align:center;}
  .cx-switch button{background:none;border:none;color:var(--accent);cursor:pointer;font-size:12.5px;padding:0;}

  .cx-type-select{display:flex;gap:8px;margin-bottom:16px;}
  .cx-type-opt{
    flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;
    padding:9px 6px;text-align:center;font-size:12px;cursor:pointer;color:var(--muted);
  }
  .cx-type-opt.active{border-color:var(--accent);color:var(--accent);background:rgba(255,185,46,0.06);}

  /* player overlay */
  .cx-player-overlay{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;}
  .cx-player-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--line);}
  .cx-player-bar h4{margin:0;font-family:'Space Grotesk',sans-serif;font-size:14px;}
  .cx-player-body{flex:1;position:relative;}
  .cx-player-body iframe{width:100%;height:100%;border:none;background:#fff;}
  .cx-player-loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:13px;background:#000;}

  @media(max-width:640px){
    .cx-sidebar{width:0;padding:0;border:none;overflow:hidden;}
    .cx-topbar{padding:12px 14px;gap:10px;}
    .cx-logo-text{display:none;}
    .cx-content{padding:16px 14px 80px;}
    .cx-hero-grid{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;height:auto;}
    .cx-hero-tile{aspect-ratio:16/10;}
    .cx-hero-tile:nth-child(1){grid-column:1/3;grid-row:auto;aspect-ratio:16/9;}
  }
</style>

<div id="cryptix-root">
  <nav class="cx-sidebar" id="cx-sidebar">
    <svg class="cx-side-logo" viewBox="0 0 100 100" onclick="document.getElementById('cx-content-top').scrollIntoView({behavior:'smooth'})">
      <circle cx="50" cy="50" r="48" fill="#fff"/>
      <circle cx="36" cy="46" r="8" fill="none" stroke="#0a0a0b" stroke-width="6"/>
      <circle cx="64" cy="46" r="8" fill="none" stroke="#0a0a0b" stroke-width="6"/>
    </svg>
    <div class="cx-side-item active" title="Home">🏠</div>
    <div class="cx-side-item" title="Trending">🔥</div>
    <div class="cx-side-item" title="New">🆕</div>
    <div class="cx-side-item" title="Puzzle">🧩</div>
    <div class="cx-side-item" title="Action">⚡</div>
    <div class="cx-side-item" title="Multiplayer">🎮</div>
    <div class="cx-side-item" title="Favorites">⭐</div>
  </nav>

  <div class="cx-main">
    <header class="cx-topbar">
      <div class="cx-logo" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff"/></svg>
        <span class="cx-logo-text">Cryptix Games</span>
      </div>
      <div class="cx-search-wrap">
        <span class="cx-search-icon">🔍</span>
        <input id="cx-search" placeholder="Search games..." />
      </div>
      <div class="cx-nav" id="cx-nav"></div>
    </header>

    <div class="cx-content" id="cx-content-top">
      <div id="cx-hero-section">
        <div class="cx-section-head"><h2>Top Picks</h2></div>
        <div class="cx-hero-grid" id="cx-hero-grid"></div>
      </div>

      <div class="cx-section-head">
        <h2 id="cx-grid-title">All Games</h2>
        <span class="cx-count" id="cx-count"></span>
      </div>
      <div class="cx-grid" id="cx-grid"></div>
    </div>
  </div>

  <button class="cx-fab" id="cx-add-fab">+ Add Game</button>
  <div id="cx-modal-zone"></div>
  <div id="cx-player-zone"></div>
</div>

  async function loadUsers(){
    try{ const r = await window.storage.get('cryptix-users', SHARED); return r ? JSON.parse(r.value) : {}; }
    catch(e){ return {}; }
  }
  async function saveUsers(u){ try{ await window.storage.set('cryptix-users', JSON.stringify(u), SHARED); }catch(e){} }
  async function loadGames(){
    try{ const r = await window.storage.get('cryptix-games', SHARED); return r ? JSON.parse(r.value) : []; }
    catch(e){ return []; }
  }

  }
  async function deleteGameFile(id){ try{ await window.storage.delete('cryptix-file-'+id, SHARED); }catch(e){} }

  function defaultCoverFor(title){
    const t = (title || '').toLowerCase();
    const hit = DEFAULT_COVERS.find(d => d.match(t));
    return hit ? hit.img : null;
  }
  function coverFor(g){ return g.cover || defaultCoverFor(g.title) || coverPlaceholder(g.title, g.id); }

  function renderNav(){
    if(state.user){
      navEl.innerHTML = `
        <span class="cx-user-chip">Hi, <b>${escapeHtml(state.user)}</b></span>
        <button class="cx-btn" id="cx-logout">Log out</button>
      `;
      document.getElementById('cx-logout').onclick = ()=>{ state.user=null; renderNav(); renderAll(); };
    } else {
      navEl.innerHTML = `<button class="cx-btn cx-btn-primary" id="cx-login-open">Log in</button>`;
      document.getElementById('cx-login-open').onclick = ()=> openAuth('login');
    }
  }

  function typeLabel(t){
    if(t==='html') return 'HTML';
    if(t==='zip') return 'ZIP';
    return 'Link';
  }

  function filteredGames(){
    const q = state.search.trim().toLowerCase();
    if(!q) return state.games;
    return state.games.filter(g => g.title.toLowerCase().includes(q));
  }

  function renderHero(){
    const recent = state.games.slice().reverse().slice(0,5);
    if(recent.length === 0 || state.search.trim()){
      heroSection.style.display = 'none';
      return;
    }
    heroSection.style.display = 'block';
    const badges = ['Top','Hot','New','Updated','Originals'];
    heroGrid.innerHTML = recent.map((g,i) => `
      <div class="cx-hero-tile" data-hero="${g.id}">
        <span class="cx-hero-badge">${badges[i % badges.length]}</span>
        <img src="${coverFor(g)}" alt="${escapeHtml(g.title)}" onerror="this.src='${coverPlaceholder(g.title, g.id)}'"/>
        <div class="cx-hero-overlay"><h4>${escapeHtml(g.title)}</h4></div>
      </div>
    `).join('');
    heroGrid.querySelectorAll('[data-hero]').forEach(el=>{
      el.onclick = ()=>{
        const g = state.games.find(x=>x.id===Number(el.dataset.hero));
        if(!g) return;
        if(g.sourceType === 'link') window.open(g.link, '_blank');
        else openPlayer(g.id);
      };
    });
  }

  function renderGrid(){
    const list = filteredGames();
    gridTitleEl.textContent = state.search.trim() ? 'Search results' : 'All Games';
    countEl.textContent = list.length + (list.length===1 ? ' game' : ' games');
    if(list.length===0){
      gridEl.style.display='block';
      gridEl.innerHTML = state.search.trim()
        ? `<div class="cx-empty">Koi game nahi mila "${escapeHtml(state.search)}" ke liye.</div>`
        : `<div class="cx-empty">Abhi koi game nahi hai. Sabse pehla game aap add karo.</div>`;
      return;
    }
    gridEl.style.display='grid';
    gridEl.innerHTML = list.slice().reverse().map(g => `
      <div class="cx-card">
        <div class="cx-thumb-wrap">
          <img src="${coverFor(g)}" alt="${escapeHtml(g.title)}" onerror="this.src='${coverPlaceholder(g.title, g.id)}'"/>
          <span class="cx-type-chip cx-mono">${typeLabel(g.sourceType)}</span>
          <div class="cx-thumb-play">
            ${g.sourceType==='link'
              ? `<a href="${escapeHtml(g.link)}" target="_blank" rel="noopener">Play</a>`
              : `<button data-play="${g.id}">Play</button>`}
          </div>
        </div>
        <div class="cx-card-body">
          <h3>${escapeHtml(g.title)}</h3>
          <p>${escapeHtml(g.desc)}</p>
          <div class="cx-card-foot">
            <span>by ${escapeHtml(g.addedBy)}</span>
            ${state.user === g.addedBy ? `<span style="display:flex;gap:6px;"><button class="cx-edit" data-edit="${g.id}">Edit</button><button class="cx-delete" data-id="${g.id}">Delete</button></span>` : ''}
          </div>
        </div>
      </div>
    `).join('');
    gridEl.querySelectorAll('.cx-delete').forEach(btn=>{ btn.onclick = ()=> confirmDelete(Number(btn.dataset.id)); });
    gridEl.querySelectorAll('.cx-edit').forEach(btn=>{ btn.onclick = ()=> openEditGame(Number(btn.dataset.edit)); });
    gridEl.querySelectorAll('[data-play]').forEach(btn=>{ btn.onclick = ()=> openPlayer(Number(btn.dataset.play)); });
  }

  function renderAll(){ renderHero(); renderGrid(); }

  searchInput.addEventListener('input', (e)=>{
    state.search = e.target.value;
    renderAll();
  });

  function openModal(html){
    modalZone.innerHTML = `<div class="cx-overlay" id="cx-overlay"><div class="cx-modal">${html}</div></div>`;
    document.getElementById('cx-overlay').addEventListener('click', (e)=>{ if(e.target.id==='cx-overlay') closeModal(); });
  }
  function closeModal(){ modalZone.innerHTML=''; }

  function openAuth(mode){
    const isLogin = mode==='login';
    openModal(`
      <button class="cx-close" id="cx-close">×</button>
      <h3>${isLogin ? 'Log in' : 'Create account'}</h3>
      <p class="cx-sub">${isLogin ? 'Apne game khelne aur upload karne ke liye login karo.' : 'Naya account banao — free hai.'}</p>
      <div id="cx-auth-error"></div>
      <div class="cx-field"><label>Username</label><input id="cx-username" autocomplete="username"/></div>
      <div class="cx-field"><label>Password</label>
        <div class="cx-pass-wrap">
          <input id="cx-password" type="password" autocomplete="current-password"/>
          <button type="button" class="cx-pass-toggle" id="cx-pass-toggle">👁</button>
        </div>
      </div>
      <div class="cx-modal-actions">
        <button class="cx-btn" id="cx-cancel" style="flex:1">Cancel</button>
        <button class="cx-btn cx-btn-primary" id="cx-submit" style="flex:1">${isLogin ? 'Log in' : 'Sign up'}</button>
      </div>
      <div class="cx-switch">
        ${isLogin ? "Naya ho? " : "Pehle se account hai? "}
        <button id="cx-switch-mode">${isLogin ? 'Sign up' : 'Log in'}</button>
      </div>
    `);
    document.getElementById('cx-close').onclick = closeModal;
    document.getElementById('cx-cancel').onclick = closeModal;
    document.getElementById('cx-switch-mode').onclick = ()=> openAuth(isLogin?'signup':'login');
    document.getElementById('cx-pass-toggle').onclick = ()=>{
      const pw = document.getElementById('cx-password');
      const btn = document.getElementById('cx-pass-toggle');
      const show = pw.type === 'password';
      pw.type = show ? 'text' : 'password';
      btn.textContent = show ? '🙈' : '👁';
    };
    document.getElementById('cx-submit').onclick = async ()=>{
      const uname = document.getElementById('cx-username').value.trim();
      const pass = document.getElementById('cx-password').value;
      const errEl = document.getElementById('cx-auth-error');
      errEl.innerHTML = '';
      if(!uname || !pass){ errEl.innerHTML = '<div class="cx-error">Username aur password dono bharo.</div>'; return; }
      const users = await loadUsers();
      if(isLogin){
        if(!users[uname] || users[uname] !== pass){ errEl.innerHTML = '<div class="cx-error">Galat username ya password.</div>'; return; }
        state.user = uname;
      } else {
        if(users[uname]){ errEl.innerHTML = '<div class="cx-error">Ye username pehle se liya gaya hai.</div>'; return; }
        users[uname] = pass;
        await saveUsers(users);
        state.user = uname;
      }
      closeModal();
      renderNav();
      renderAll();
    };
  }

  function addGameModalHtml(sourceType, existing){
    const isEdit = !!existing;
    const linkField = `<div class="cx-field" id="cx-field-link"><label>Play link (URL)</label><input id="cx-g-link" placeholder="https://..." value="${existing && existing.sourceType==='link' ? escapeHtml(existing.link) : ''}"/><p class="cx-hint">Kisi bhi type ke hosted game ko link kar sakte ho.</p></div>`;
    const htmlField = `<div class="cx-field" id="cx-field-htmlfile"><label>HTML game file (.html)</label><input id="cx-g-htmlfile" type="file" accept=".html,.htm"/><p class="cx-hint">${isEdit && existing.sourceType==='html' ? 'Khali chodo to purani file wahi rahegi.' : 'Self-contained .html file upload karo.'}</p></div>`;
    const zipField = `<div class="cx-field" id="cx-field-zipfile"><label>ZIP game (.zip)</label><input id="cx-g-zipfile" type="file" accept=".zip"/><p class="cx-hint">${isEdit && existing.sourceType==='zip' ? 'Khali chodo to purani file wahi rahegi.' : 'Multi-file game ZIP (index.html zaroori). Max ~3.5MB.'}</p></div>`;
    return `
      <button class="cx-close" id="cx-close">×</button>
      <h3>${isEdit ? 'Remake / Edit game' : 'Add a game'}</h3>
      <p class="cx-sub">${isEdit ? 'Apne game ki details update karo.' : 'Apna game library mein daalo.'}</p>
      <div id="cx-game-error"></div>
      <div class="cx-type-select">
        <div class="cx-type-opt ${sourceType==='link'?'active':''}" data-type="link">🔗 Link</div>
        <div class="cx-type-opt ${sourceType==='html'?'active':''}" data-type="html">📄 HTML file</div>
        <div class="cx-type-opt ${sourceType==='zip'?'active':''}" data-type="zip">🗜️ ZIP file</div>
      </div>
      <div class="cx-field"><label>Title</label><input id="cx-g-title" placeholder="e.g. Cipher Runner" value="${existing ? escapeHtml(existing.title) : ''}"/></div>
      <div class="cx-field"><label>Description</label><textarea id="cx-g-desc" placeholder="Game kis baare mein hai...">${existing ? escapeHtml(existing.desc) : ''}</textarea></div>
      <div class="cx-field"><label>Cover image URL (optional)</label><input id="cx-g-cover" placeholder="https://... (khali chodo to auto banega)" value="${existing && existing.cover ? escapeHtml(existing.cover) : ''}"/></div>
      <div class="cx-field"><label>...ya thumbnail image upload karo</label><input id="cx-g-coverfile" type="file" accept="image/*"/><p class="cx-hint">File upload karoge to ye URL field se zyada priority lega.</p></div>
      ${sourceType==='link' ? linkField : ''}
      ${sourceType==='html' ? htmlField : ''}
      ${sourceType==='zip' ? zipField : ''}
      <div class="cx-modal-actions">
        <button class="cx-btn" id="cx-cancel" style="flex:1">Cancel</button>
        <button class="cx-btn cx-btn-primary" id="cx-submit" style="flex:1">${isEdit ? 'Save changes' : 'Add game'}</button>
      </div>
    `;
  }

  function openAddGame(sourceType){
    if(!state.user){ openAuth('login'); return; }
    sourceType = sourceType || 'link';
    openModal(addGameModalHtml(sourceType));
    wireAddGame(sourceType, null);
  }

  function openEditGame(id){
    const game = state.games.find(g=>g.id===id);
    if(!game || game.addedBy !== state.user) return;
    openModal(addGameModalHtml(game.sourceType, game));
    wireAddGame(game.sourceType, game.id);
  }

  function wireAddGame(sourceType, editId){
    const existing = editId ? state.games.find(g=>g.id===editId) : null;
    document.getElementById('cx-close').onclick = closeModal;
    document.getElementById('cx-cancel').onclick = closeModal;
    document.querySelectorAll('.cx-type-opt').forEach(el=>{
      el.onclick = ()=>{
        const t = el.dataset.type;
        const title = document.getElementById('cx-g-title').value;
        const desc = document.getElementById('cx-g-desc').value;
        const cover = document.getElementById('cx-g-cover').value;
        openModal(addGameModalHtml(t, existing));
        wireAddGame(t, editId);
        document.getElementById('cx-g-title').value = title;
        document.getElementById('cx-g-desc').value = desc;
        document.getElementById('cx-g-cover').value = cover;
      };
    });

    document.getElementById('cx-submit').onclick = async ()=>{
      const title = document.getElementById('cx-g-title').value.trim();
      const desc = document.getElementById('cx-g-desc').value.trim();
      const coverUrl = document.getElementById('cx-g-cover').value.trim();
      const coverFileInput = document.getElementById('cx-g-coverfile');
      const coverFile = coverFileInput ? coverFileInput.files[0] : null;
      const errEl = document.getElementById('cx-game-error');
      errEl.innerHTML = '';
      if(!title){ errEl.innerHTML = '<div class="cx-error">Title zaroori hai.</div>'; return; }
      if(coverFile && coverFile.size > MAX_COVER_BYTES){
        errEl.innerHTML = '<div class="cx-error">Thumbnail image bahut badi hai (max ~350KB). Chota image try karo ya URL use karo.</div>';
        return;
      }

      const submitBtn = document.getElementById('cx-submit');
      const busyLabel = editId ? 'Saving...' : 'Uploading...';
      const idleLabel = editId ? 'Save changes' : 'Add game';
      let coverValue = coverUrl || (existing ? existing.cover : '') || '';
      if(coverFile){
        submitBtn.textContent = 'Uploading thumbnail...'; submitBtn.disabled = true;
        try{ coverValue = await fileToDataURL(coverFile); }
        catch(e){ errEl.innerHTML = '<div class="cx-error">Thumbnail upload nahi ho payi.</div>'; submitBtn.textContent = idleLabel; submitBtn.disabled = false; return; }
      }
      const games = await loadGames();
      const id = editId || (games.length ? Math.max(...games.map(g=>g.id))+1 : 1);
      const prevType = existing ? existing.sourceType : null;
      const entry = { id, title, desc: desc || 'No description yet.', cover: coverValue, addedBy: existing ? existing.addedBy : state.user, sourceType };

      async function commit(){
        if(editId){
          const idx = games.findIndex(g=>g.id===id);
          if(idx>-1) games[idx] = entry; else games.push(entry);
        } else {
          games.push(entry);
        }
        await saveGames(games);
        state.games = games;
        closeModal();
        renderAll();
      }

      if(sourceType === 'link'){
        const link = document.getElementById('cx-g-link').value.trim();
        if(!link){ errEl.innerHTML = '<div class="cx-error">Link zaroori hai.</div>'; return; }
        entry.link = link;
        if(editId && (prevType === 'html' || prevType === 'zip')) await deleteGameFile(id);
        await commit();
        return;
      }

      if(sourceType === 'html'){
        const fileInput = document.getElementById('cx-g-htmlfile');
        const file = fileInput.files[0];
        if(!file && !(editId && prevType==='html')){ errEl.innerHTML = '<div class="cx-error">HTML file chuno.</div>'; return; }
        submitBtn.textContent = busyLabel; submitBtn.disabled = true;
        try{
          if(file){
            const text = await file.text();
            if(text.length > MAX_HTML_CHARS){
              errEl.innerHTML = '<div class="cx-error">File bahut badi hai.</div>';
              submitBtn.textContent = idleLabel; submitBtn.disabled = false;
              return;
            }
            await saveGameFile(id, { type:'html', content: text });
          } else if(editId && prevType === 'zip'){
            errEl.innerHTML = '<div class="cx-error">HTML file chuno.</div>';
            submitBtn.textContent = idleLabel; submitBtn.disabled = false;
            return;
          }
          await commit();
        }catch(e){
          errEl.innerHTML = '<div class="cx-error">File read nahi ho payi.</div>';
          submitBtn.textContent = idleLabel; submitBtn.disabled = false;
        }
        return;
      }

      if(sourceType === 'zip'){
        const fileInput = document.getElementById('cx-g-zipfile');
        const file = fileInput.files[0];
        if(!file && !(editId && prevType==='zip')){ errEl.innerHTML = '<div class="cx-error">ZIP file chuno.</div>'; return; }
        if(file && file.size > MAX_ZIP_BYTES){ errEl.innerHTML = '<div class="cx-error">ZIP bahut badi hai (max ~3.5MB).</div>'; return; }
        submitBtn.textContent = busyLabel; submitBtn.disabled = true;
        try{
          if(file){
            const base64 = await fileToBase64(file);
            await saveGameFile(id, { type:'zip', filename: file.name, dataBase64: base64 });
          } else if(editId && prevType === 'html'){
            errEl.innerHTML = '<div class="cx-error">ZIP file chuno.</div>';
            submitBtn.textContent = idleLabel; submitBtn.disabled = false;
            return;
          }
          await commit();
        }catch(e){
          errEl.innerHTML = '<div class="cx-error">File read nahi ho payi.</div>';
          submitBtn.textContent = idleLabel; submitBtn.disabled = false;
        }
        return;
      }
    };
  }

  function fileToBase64(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const result = reader.result;
        resolve(result.substring(result.indexOf(',')+1));
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function fileToDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function loadScript(src){
    return new Promise((resolve, reject)=>{
      if(document.querySelector('script[data-cx-src="'+src+'"]')){ resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.dataset.cxSrc = src; s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
  }

  function guessMime(name){
    const ext = name.split('.').pop().toLowerCase();
    const map = { png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', svg:'image/svg+xml',
      css:'text/css', js:'application/javascript', json:'application/json', html:'text/html', htm:'text/html',
      mp3:'audio/mpeg', wav:'audio/wav', ogg:'audio/ogg', woff:'font/woff', woff2:'font/woff2', ttf:'font/ttf' };
    return map[ext] || 'application/octet-stream';
  }

  async function openPlayer(id){
    const game = state.games.find(g=>g.id===id);
    if(!game) return;
    playerZone.innerHTML = `
      <div class="cx-player-overlay" id="cx-player-overlay">
        <div class="cx-player-bar">
          <h4>${escapeHtml(game.title)}</h4>
          <button class="cx-btn" id="cx-player-close">Close</button>
        </div>
        <div class="cx-player-body" id="cx-player-body">
          <div class="cx-player-loading" id="cx-player-loading">Loading game...</div>
        </div>
      </div>
    `;
    document.getElementById('cx-player-close').onclick = ()=>{ playerZone.innerHTML=''; };
    const bodyEl = document.getElementById('cx-player-body');
    const loadingEl = document.getElementById('cx-player-loading');

    const file = await loadGameFile(id);
    if(!file){ loadingEl.textContent = 'Game file nahi mil paayi.'; return; }

    if(file.type === 'html'){
      const iframe = document.createElement('iframe');
      iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-modals';
      iframe.srcdoc = file.content;
      bodyEl.appendChild(iframe);
      loadingEl.remove();
      return;
    }

    if(file.type === 'zip'){
      try{
        if(!jszipLoaded){
          loadingEl.textContent = 'Loading unzip engine...';
          await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
          jszipLoaded = true;
        }
        loadingEl.textContent = 'Unzipping game...';
        const zip = await JSZip.loadAsync(file.dataBase64, { base64: true });
        const entries = Object.keys(zip.files).filter(n => !zip.files[n].dir);
        let indexName = entries.find(n => /(^|\/)index\.html?$/i.test(n)) || entries.find(n => /\.html?$/i.test(n));
        if(!indexName){ loadingEl.textContent = 'ZIP ke andar koi HTML file nahi mili.'; return; }
        const urlMap = {};
        for(const name of entries){
          if(name === indexName) continue;
          const blob = await zip.files[name].async('blob');
          const typedBlob = blob.slice(0, blob.size, guessMime(name));
          urlMap[name] = URL.createObjectURL(typedBlob);
          const shortName = name.split('/').pop();
          if(!(shortName in urlMap)) urlMap[shortName] = urlMap[name];
        }
        let html = await zip.files[indexName].async('string');
        Object.keys(urlMap).sort((a,b)=>b.length-a.length).forEach(name=>{
          const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          html = html.replace(new RegExp('(["\'\(])' + escaped + '(["\'\)])', 'g'), '$1' + urlMap[name] + '$2');
        });
        const htmlBlob = new Blob([html], { type: 'text/html' });
        const iframe = document.createElement('iframe');
        iframe.sandbox = 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-modals';
        iframe.src = URL.createObjectURL(htmlBlob);
        bodyEl.appendChild(iframe);
        loadingEl.remove();
      }catch(e){
        loadingEl.textContent = 'Game load nahi ho paaya. ZIP structure check karo.';
      }
      return;
    }
  }

  function confirmDelete(id){
    const game = state.games.find(g=>g.id===id);
    if(!game) return;
    openModal(`
      <button class="cx-close" id="cx-close">×</button>
      <h3>Delete "${escapeHtml(game.title)}"?</h3>
      <p class="cx-sub">Ye action wapas nahi ho sakta.</p>
      <div class="cx-modal-actions">
        <button class="cx-btn" id="cx-cancel" style="flex:1">Cancel</button>
        <button class="cx-btn" id="cx-confirm-delete" style="flex:1;background:var(--danger);border:none;color:#1a0000;">Delete</button>
      </div>
    `);
    document.getElementById('cx-close').onclick = closeModal;
    document.getElementById('cx-cancel').onclick = closeModal;
    document.getElementById('cx-confirm-delete').onclick = async ()=>{
      const games = (await loadGames()).filter(g=>g.id!==id);
      await saveGames(games);
      if(game.sourceType === 'html' || game.sourceType === 'zip') await deleteGameFile(id);
      state.games = games;
      closeModal();
      renderAll();
    };
  }

  fab.onclick = ()=> openAddGame('link');

  (async function init(){
    state.games = await loadGames();
    renderNav();
    renderAll();
  })();
})();
</script>
