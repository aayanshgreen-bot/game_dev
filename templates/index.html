<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptix Games</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>



<div id="cx-loader" class="cx-loader" style="display: none;">
  <lottie-player src="{{ url_for('static', filename='Gaming Console.json') }}" background="transparent" speed="1" style="width: 300px; height: 300px;" loop autoplay></lottie-player>
</div>

<div id="cryptix-root">
  <div class="bg-animations">
    <div class="cx-shape circle" style="top:20%; left:10%; width: 50px; height: 50px; background: #d946ef; animation-duration: 8s;"></div>
    <div class="cx-shape circle-outline" style="top:70%; left:25%; width: 60px; height: 60px; animation-duration: 12s; animation-delay: 1s;"></div>
    <div class="cx-shape cross" style="top:80%; left:70%; animation-duration: 9s;"></div>
    <div class="cx-shape cross" style="top:15%; right:15%; animation-duration: 11s; animation-delay: 2s; transform: scale(0.7);"></div>
    <div class="cx-shape star" style="top:40%; right:8%; animation-duration: 14s;">★</div>
    <div class="cx-shape circle" style="bottom:10%; right:20%; width:20px; height:20px; background:#10b981; animation-duration: 7s;"></div>
    <div class="cx-shape circle-outline" style="top:5%; left:50%; width: 30px; height: 30px; border-width: 3px; animation-duration: 15s; animation-delay: 3s;"></div>
  </div>



  <div class="cx-main">
    <header class="cx-topbar">
      <div class="cx-logo" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#fff"/></svg>
        <span class="cx-logo-text">Cryptix Games</span>
      </div>
      <div class="cx-search-wrap">
        <span class="cx-search-icon">🔍</span>
        <input id="cx-search" placeholder="Search games..." />
      </div>
      <div class="cx-nav" id="cx-nav"></div>
    </header>

    <div class="cx-content" id="cx-content-top">
      <div id="cx-hero-section">
        <div class="cx-section-head"><h2>Top Picks</h2></div>
        <div class="cx-hero-grid" id="cx-hero-grid"></div>
      </div>

      <div class="cx-section-head">
        <h2 id="cx-grid-title">All Games</h2>
        <span class="cx-count" id="cx-count"></span>
      </div>
      <div class="cx-grid" id="cx-grid"></div>
    </div>
  </div>

  <button class="cx-fab" id="cx-add-fab">+ Add Game</button>
  <div id="cx-modal-zone"></div>
  <div id="cx-player-zone"></div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
